name: 安装工具链与依赖
description: 使用固定 pnpm 版本和 lockfile 安装依赖
inputs:
  ignore-scripts:
    description: 发布 job 跳过依赖安装脚本
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        package-manager-cache: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - run: pnpm install --frozen-lockfile --ignore-scripts=${{ inputs.ignore-scripts }}
      shell: bash
